nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-pull-secret

storage:
  type: pvc
  pvcName: opsiforce-cephfs
  className: ""
  size: 200Gi
  hostPath: /tmp/opsiforce-data

agent:
  image:
    repository: ""
    tag: agent
    pullPolicy: Always
  port: 4096
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []

warmPool:
  size: 1

timeout:
  idleMinutes: 30

valkey:
  enabled: true
  replica:
    enabled: false
  auth:
    enabled: false
  valkeyConfig: |
    notify-keyspace-events Ex
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  affinity: {}
